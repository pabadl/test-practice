spring.application.name=test-practice

# Usar H2 en memoria (dev). Para persistir en disco usa jdbc:h2:file:./data/testdb
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate: actualizar esquema automáticamente (dev). En producción use migraciones.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar consola web H2 (accesible en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Exponer el endpoint health (y opcionalmente info)
management.endpoints.web.exposure.include=health,info
# (Opcional) mostrar detalles en /actuator/health
management.endpoint.health.show-details=always